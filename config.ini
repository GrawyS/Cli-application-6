[settings]
; Имя анализируемого пакета: groupId:artifactId (в тестовом режиме - буква A-Z)
package_name = org.apache.commons:commons-text

; URL Maven-репозитория (real) или путь к файлу описания графа (test)
repo_url = https://repo1.maven.org/maven2

; Режим работы: real - настоящий репозиторий, test - тестовый файл
repo_mode = real

; Версия пакета (в тестовом режиме не используется)
package_version = 1.11.0

; Имя SVG-файла с изображением графа; рядом создаётся .puml
output_file = graph.svg

; Выводить зависимости в виде ASCII-дерева: true или false
ascii_tree = true

; Максимальная глубина анализа зависимостей (целое число >= 1)
max_depth = 4
